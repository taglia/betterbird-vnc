name: Build and Publish Docker Images

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *' # Daily upstream checks
    - cron: '41 4 * * 0' # Weekly clean security rebuild

permissions:
  contents: read

concurrency:
  group: images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: betterbird-vnc

jobs:
  build-and-push:
    if: github.event_name != 'schedule' || github.event.schedule == '41 4 * * 0'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Test update and cleanup safety
        run: |
          bash tests/test-update-betterbird.sh
          python3 tests/test-cleanup-registries.py
      - uses: docker/setup-buildx-action@v4
      - name: Read pinned release
        id: version
        run: |
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
          echo "sha256=$(cat BETTERBIRD_SHA256)" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: |
            ${{ vars.DOCKER_HUB_NAMESPACE || 'tagliasteel' }}/${{ env.IMAGE_NAME }}
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.version }},enable={{is_default_branch}}
            type=ref,event=pr
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
      - name: Build fresh image for verification
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          pull: true
          no-cache: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BETTERBIRD_VERSION=${{ steps.version.outputs.version }}
            BETTERBIRD_SHA256=${{ steps.version.outputs.sha256 }}
      - name: Report all high and critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: json
          output: trivy-results.json
          severity: CRITICAL,HIGH
          exit-code: '0'
      - name: Preserve security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulnerability-report
          path: trivy-results.json
          if-no-files-found: warn
      - name: Block publication on fixable high or critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish exactly the scanned image
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker push "$tag"
          done <<< "$TAGS"
      - uses: peter-evans/dockerhub-description@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
          repository: ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}
          readme-filepath: ./DOCKER_HUB_README.md

  cleanup-old-images:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Clean obsolete registry tags (preserve latest and three releases)
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          KEEP_VERSION_TAGS: '3'
          # Legacy tag did not identify the downloaded binary reliably.
          RETIRED_TAGS: '140.5.0esr-bb14'
        run: python3 scripts/cleanup-registries.py --apply

  check-updates:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '17 3 * * *')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
      - name: Resolve stable upstream version and checksum
        id: check
        run: bash scripts/update-betterbird.sh
      - name: Check stable noVNC and websockify releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update-vnc-dependencies.py
      - uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.PAT_TOKEN }}
          commit-message: Update pinned Betterbird release and checksum
          title: Update Betterbird and VNC dependencies to stable releases
          body: |
            Automated stable-release update, including the upstream SHA-256.
            Review release/security notes and back up profiles before major upgrades.
            Merge after CI passes; running containers must then be pulled and recreated.
          branch: update-betterbird-version
          delete-branch: true
          add-paths: |
            VERSION
            BETTERBIRD_SHA256
            Dockerfile
            docker-compose.yml
