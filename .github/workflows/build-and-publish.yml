name: Build and Publish Docker Images

on:
  push:
    branches:
      - main
      # Temporary: publish this branch as a test tag for pre-merge validation
      - security/trixie-vuln-reduction
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Check for BetterBird updates weekly (Sundays at 2 AM UTC)
    - cron: '0 2 * * 0'

env:
  IMAGE_NAME: betterbird-vnc

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract BetterBird version
        id: version
        run: |
          VERSION=$(cat VERSION)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "BetterBird version: $VERSION"

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.version }},enable={{is_default_branch}}
            type=raw,value=trixie-test,enable=${{ github.ref == 'refs/heads/security/trixie-vuln-reduction' }}
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker images
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BETTERBIRD_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities (report only)
        if: github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Update Docker Hub description
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
          repository: ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}
          readme-filepath: ./DOCKER_HUB_README.md
          short-description: "BetterBird email client with web-based VNC access via noVNC"

  cleanup-old-images:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      packages: write
    env:
      KEEP_VERSION_TAGS: 3
    steps:
      # ghcr accumulates untagged image versions on every push (each time a
      # tag like 'latest' is reused, the old digest stays behind untagged)
      - name: Delete untagged ghcr image versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ env.IMAGE_NAME }}
          package-type: container
          delete-only-untagged-versions: 'true'

      - name: Delete old Docker Hub tags
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
        run: |
          set -e
          JWT=$(curl -fsS -H "Content-Type: application/json" -X POST \
            -d "{\"username\": \"$DOCKER_HUB_USERNAME\", \"password\": \"$DOCKER_HUB_TOKEN\"}" \
            https://hub.docker.com/v2/users/login/ | jq -r .token)

          TAGS=$(curl -fsS -H "Authorization: JWT $JWT" \
            "https://hub.docker.com/v2/repositories/$DOCKER_HUB_USERNAME/$IMAGE_NAME/tags/?page_size=100" \
            | jq -r '.results | sort_by(.last_updated) | reverse | .[].name')

          # Keep 'latest' plus the $KEEP_VERSION_TAGS most recently pushed
          # other tags; delete the rest.
          COUNT=0
          for tag in $TAGS; do
            if [ "$tag" = "latest" ]; then
              echo "Keeping: $tag"
              continue
            fi
            COUNT=$((COUNT+1))
            if [ "$COUNT" -le "$KEEP_VERSION_TAGS" ]; then
              echo "Keeping: $tag"
            else
              echo "Deleting: $tag"
              curl -fsS -X DELETE -H "Authorization: JWT $JWT" \
                "https://hub.docker.com/v2/repositories/$DOCKER_HUB_USERNAME/$IMAGE_NAME/tags/$tag/" \
                || echo "WARNING: failed to delete $tag (token may need 'Read, Write, Delete' scope)"
            fi
          done

  check-updates:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Check for BetterBird updates
        id: check
        run: |
          chmod +x scripts/update-betterbird.sh
          
          # Capture the script output
          OUTPUT=$(scripts/update-betterbird.sh 2>&1)
          echo "$OUTPUT"
          
          # Check if update is needed
          if echo "$OUTPUT" | grep -q "Update available"; then
            echo "update_available=true" >> $GITHUB_OUTPUT
          else
            echo "update_available=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request for version update
        if: steps.check.outputs.update_available == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.PAT_TOKEN }}
          commit-message: "Update BetterBird version"
          title: "Update BetterBird to latest version"
          body: |
            Automated update of BetterBird version detected.
            
            This PR was automatically created by the update check workflow.
            
            Please review the changes and merge if appropriate.
          branch: update-betterbird-version
          delete-branch: true
